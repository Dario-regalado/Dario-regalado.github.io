<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../fotos/logo.ico" type="image/x-icon" />
  <title>Calendario Admin - Vanesa's Peluqueria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/calendar.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>
</head>
<body>
  <header class="admin-header">
    <div class="container admin-header-inner">
      <a class="brand" href="dashboard.html">Vanesa's Peluqueria</a>
      <nav class="admin-nav">
        <a href="reservas.html" class="btn-secondary btn-sm">Reservas</a>
        <a href="dashboard.html" class="btn-secondary btn-sm">Dashboard</a>
        <a href="../index.html" class="btn-secondary btn-sm">Volver al sitio</a>
        <button id="logout-btn" class="btn btn-secondary" type="button">Cerrar sesion</button>
      </nav>
    </div>
  </header>

  <main id="contenido">
    <section class="section">
      <div class="container">
        <h1 class="section-title">Calendario de Citas</h1>

        <div class="calendar-layout">
          <div class="calendar-container">
            <div class="calendar-header">
              <button class="calendar-nav" id="prev-month" type="button" aria-label="Mes anterior">&larr;</button>
              <h2 id="month-year"></h2>
              <button class="calendar-nav" id="next-month" type="button" aria-label="Mes siguiente">&rarr;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
          </div>

          <div class="appointments-panel">
            <h3>Citas del día</h3>
            <p class="day-label" id="day-label">Selecciona un día para ver las citas</p>
            <div id="day-appointments"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/main.js" defer></script>
  <script type="module" src="../js/supabase.js"></script>
  <script type="module" src="../js/calendar-admin.js?v=1"></script>
  <script type="module">
    import { logout } from '../js/auth.js'
    document.getElementById('logout-btn').addEventListener('click', async () => {
      try { await logout(); window.location.replace('/admin/') } catch (e) { console.error(e) }
    })
  </script>
</body>
</html>
