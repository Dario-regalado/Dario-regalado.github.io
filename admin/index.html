<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../fotos/logo.ico" type="image/x-icon" />
  <title>Admin - Vanesa's Peluqueria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>
</head>
<body class="admin-page">
  <main class="login-container">
    <div class="login-card">
      <h1>Vanesa's Peluqueria</h1>
      <p class="login-subtitle">Acceso administrador</p>
      <form id="login-form" class="login-form" method="POST" autocomplete="off">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@ejemplo.com" />

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />

        <p id="login-error" class="form-error" style="display:none"></p>

        <button type="submit" class="btn btn-primary login-btn">Entrar</button>
      </form>
      <a href="../index.html" class="back-link">Volver a la web</a>
    </div>
  </main>

  <script type="module">
    import { login, redirectIfLoggedIn } from '../js/auth.js'

    redirectIfLoggedIn().catch(() => {})
    console.log('Login page loaded')

    const form = document.getElementById('login-form')
    const emailInput = document.getElementById('email')
    const passwordInput = document.getElementById('password')
    const errorEl = document.getElementById('login-error')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorEl.style.display = 'none'
      errorEl.textContent = ''

      const email = emailInput.value.trim()
      const password = passwordInput.value

      if (!email || !password) {
        errorEl.textContent = 'Completa todos los campos'
        errorEl.style.display = 'block'
        return
      }

      const submitBtn = form.querySelector('button[type="submit"]')
      submitBtn.disabled = true
      submitBtn.textContent = 'Entrando...'

      try {
        await login(email, password)
        window.location.href = '/admin/dashboard.html'
      } catch (err) {
        console.error('Login error:', err)
        const msg = err.message || String(err)
        errorEl.textContent = msg.includes('Invalid login credentials')
          ? 'Email o contraseña incorrectos'
          : `Error: ${msg}`
        errorEl.style.display = 'block'
        submitBtn.disabled = false
        submitBtn.textContent = 'Entrar'
      }
    })
  </script>
</body>
</html>
