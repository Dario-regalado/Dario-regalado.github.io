# HTTP server for Vanesa's Peluqueria
# Replace pelu.tu-dominio.com with your real domain

# Per-IP anti-DoS limits (free, native Nginx)
# These directives must be in HTTP context; site files in sites-enabled are loaded there.
limit_req_zone $binary_remote_addr zone=perip_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name pelu.tu-dominio.com www.pelu.tu-dominio.com;

    root /var/www/pelu;
    index index.html;

    access_log /var/log/nginx/pelu.access.log;
    error_log /var/log/nginx/pelu.error.log;

    # Slowloris and resource abuse protection
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    client_max_body_size 1m;

    # Return 429 when limits are exceeded
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn perip_conn 20;

    location / {
        # Per-IP request rate limiting
        limit_req zone=perip_rate burst=20 nodelay;

        # Static site: only safe read methods
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri/ /index.html;
    }

    # Service worker should not be heavily cached
    location = /sw.js {
        limit_req zone=perip_rate burst=10 nodelay;

        limit_except GET HEAD {
            deny all;
        }

        add_header Cache-Control "no-cache";
    }

    # Do not serve hidden files
    location ~ /\..* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Uncomment after certbot for automatic redirect to HTTPS
    # return 301 https://$host$request_uri;
}
